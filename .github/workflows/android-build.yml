name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.APP_KEYSTORE_BASE64 }}
      run: |
        echo $ENCODED_STRING | base64 -d > release.jks

    - name: Build with Gradle
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/release.jks
        KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        ADMOB_BANNER_ID: ${{ secrets.APP_ADMOB_BANNER_ID }}
        ADMOB_INTERSTITIAL_ID: ${{ secrets.APP_ADMOB_INTERSTITIAL_ID }}
      run: ./gradlew build

    # The following steps are commented out. To enable them, you will need to
    # create a signing key and add it to your GitHub repository secrets.
