<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .scan-frame {
            position: relative;
            box-shadow: 0 0 0 9999px rgba(17, 24, 39, 0.8);
            border-radius: 20px;
        }
        .scan-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: white;
            border-style: solid;
        }
        .scan-corner-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 20px; }
        .scan-corner-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 20px; }
        .scan-corner-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 20px; }
        .scan-corner-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 20px; }
        
        .pulse {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(255,255,255,0.8)); }
            50% { opacity: .7; filter: drop-shadow(0 0 2px rgba(255,255,255,0.3)); }
        }
        
        /* Custom safe area padding for mobile PWA feel */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
    </style>
