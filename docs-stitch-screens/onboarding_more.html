<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>QuickScan Pro - Onboarding 3</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",

                extend: {

                        "on-tertiary-fixed-variant": "#7d2d00",
                        "secondary-fixed-dim": "#4edea3",
                        "outline-variant": "#c3c6d7",
                        "secondary": "#006c49",
                        "tertiary-fixed-dim": "#ffb596",
                        "outline": "#737686",
                        "tertiary-container": "#bc4800",
                        "surface-dim": "#d3daef",
                        "on-background": "#141b2b",
                        "surface-container": "#e9edff",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#b4c5ff",
                        "surface-tint": "#0053db",
                        "error": "#ba1a1a",
                        "primary-fixed": "#dbe1ff",
                        "on-secondary-fixed-variant": "#005236",
                        "on-primary-container": "#eeefff",
                        "on-surface": "#141b2b",

                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#00714d",

                        "on-tertiary-fixed": "#360f00",

                        "on-error": "#ffffff",

                        "background": "#f9f9ff",
                        "surface-container-low": "#f1f3ff",
                        "on-surface-variant": "#434655",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-primary-fixed": "#00174b",
                        "inverse-surface": "#293040",
                        "surface-container-high": "#e1e8fd",
                        "surface-variant": "#dce2f7",
                        "on-tertiary-container": "#ffede6",
                        "primary-container": "#2563eb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "1rem",
                        "stack-lg": "1.5rem",
                        "margin-desktop": "2rem",
                        "margin-mobile": "1.25rem",
                        "stack-md": "1rem",
                        "stack-sm": "0.5rem"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],

            }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar (Modified for Onboarding) -->
<header class="w-full top-0 left-0 sticky flex items-center justify-between px-margin-mobile h-16 bg-surface dark:bg-on-background z-50">
<div class="flex items-center gap-2">
<span aria-hidden="true" class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">QuickScan Pro</span>
</div>
<button class="text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity active:scale-95 duration-100 font-label-md text-label-md">
            Skip
        </button>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pb-[120px] pt-stack-lg max-w-lg mx-auto w-full">
<!-- Illustration -->
<div class="mb-stack-lg w-full flex justify-center">
<div class="w-64 h-64 bg-surface-container rounded-full flex items-center justify-center shadow-lg relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary/10 to-transparent"></div>
<span class="material-symbols-outlined text-[100px] text-primary" data-icon="build_circle">build_circle</span>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-stack-md mt-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">Do More</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[85%] mx-auto">
                Generate QR codes, import calendar events, check password leaks, and keep a timeline of all your scans.
            </p>
</div>
</main>
<!-- Footer Controls -->
<footer class="fixed bottom-0 left-0 w-full px-margin-mobile pb-margin-mobile pt-stack-md bg-gradient-to-t from-background via-background to-transparent z-40 max-w-lg mx-auto left-1/2 -translate-x-1/2">
<div class="flex flex-col items-center gap-stack-lg w-full">
<!-- Indicators -->
<div aria-label="Onboarding progress" class="flex gap-2 justify-center">
<div aria-hidden="true" class="w-2.5 h-2.5 rounded-full border border-outline bg-transparent"></div>
<div aria-hidden="true" class="w-2.5 h-2.5 rounded-full border border-outline bg-transparent"></div>
<div aria-current="step" aria-hidden="true" class="w-2.5 h-2.5 rounded-full bg-primary"></div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full shadow-lg active:scale-95 transition-transform duration-200 hover:opacity-90 flex items-center justify-center gap-2">
                Get Started
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
</body></html>
