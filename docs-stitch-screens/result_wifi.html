<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>QuickScan Pro - Scan Result</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "on-tertiary-container": "#ffede6",
                            "on-tertiary-fixed-variant": "#7d2d00",
                            "surface-container-high": "#e1e8fd",
                            "on-tertiary-fixed": "#360f00",
                            "on-secondary-fixed": "#002113",
                            "surface-variant": "#dce2f7",
                            "surface": "#f9f9ff",
                            "on-primary-fixed": "#00174b",
                            "surface-container-low": "#f1f3ff",
                            "secondary": "#006c49",
                            "on-surface": "#141b2b",
                            "on-secondary": "#ffffff",
                            "on-primary-container": "#eeefff",
                            "surface-dim": "#d3daef",
                            "primary": "#004ac6",
                            "on-error": "#ffffff",
                            "on-tertiary": "#ffffff",
                            "on-primary-fixed-variant": "#003ea8",
                            "primary-fixed-dim": "#b4c5ff",
                            "surface-container-lowest": "#ffffff",
                            "secondary-fixed": "#6ffbbe",
                            "on-primary": "#ffffff",
                            "inverse-primary": "#b4c5ff",
                            "tertiary": "#943700",
                            "on-secondary-container": "#00714d",
                            "on-background": "#141b2b",
                            "error": "#ba1a1a",
                            "outline": "#737686",
                            "surface-tint": "#0053db",
                            "surface-bright": "#f9f9ff",
                            "inverse-surface": "#293040",
                            "tertiary-fixed-dim": "#ffb596",
                            "inverse-on-surface": "#edf0ff",
                            "error-container": "#ffdad6",
                            "background": "#f9f9ff",
                            "surface-container-highest": "#dce2f7",
                            "secondary-container": "#6cf8bb",
                            "primary-fixed": "#dbe1ff",
                            "on-surface-variant": "#434655",
                            "outline-variant": "#c3c6d7",
                            "on-secondary-fixed-variant": "#005236",
                            "on-error-container": "#93000a",
                            "tertiary-fixed": "#ffdbcd",
                            "secondary-fixed-dim": "#4edea3",
                            "primary-container": "#2563eb",
                            "surface-container": "#e9edff",
                            "tertiary-container": "#bc4800"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                    },
                    "spacing": {
                            "stack-sm": "0.5rem",
                            "gutter": "1rem",
                            "stack-md": "1rem",
                            "margin-mobile": "1.25rem",
                            "margin-desktop": "2rem",
                            "stack-lg": "1.5rem"
                    },
                    "fontFamily": {
                            "label-sm": ["Inter"],
                            "headline-lg-mobile": ["Inter"],
                            "body-md": ["Inter"],
                            "headline-md": ["Inter"],
                            "headline-lg": ["Inter"],
                            "label-md": ["Inter"],
                            "body-lg": ["Inter"]
                    },
                    "fontSize": {
                            "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                            "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                            "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                            "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                            "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                            "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased pb-safe">
<!-- Top App Bar (Custom for Scan Result, no BottomNavBar as it's a linear task flow) -->
<header class="flex justify-between items-center px-margin-mobile py-stack-md bg-surface/80 backdrop-blur-md sticky top-0 z-50">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex items-center gap-2 bg-surface-container-high px-3 py-1.5 rounded-full">
<span class="material-symbols-outlined text-primary text-[18px]">wifi</span>
<span class="font-label-md text-label-md text-primary">Wi-Fi</span>
</div>
<div class="w-10 h-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow px-margin-mobile flex flex-col gap-stack-lg max-w-2xl mx-auto w-full pt-stack-md">
<!-- Network Info Card -->
<section class="bg-[#F9FAFB] rounded-xl p-6 flex flex-col items-center gap-stack-md shadow-sm border border-outline-variant/30">
<div class="w-16 h-16 bg-surface-container-highest rounded-full flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-[32px] text-primary">wifi</span>
</div>
<div class="text-center w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-1 truncate">Office_Guest</h1>
<div class="flex items-center justify-center gap-2 text-on-surface-variant bg-surface px-4 py-2 rounded-lg border border-outline-variant/30 mx-auto w-fit">
<span class="font-body-md text-body-md font-mono tracking-widest" id="password-field">••••••••</span>
<button aria-label="Toggle password visibility" class="text-primary hover:text-primary-fixed-variant transition-colors" onclick="document.getElementById('password-field').textContent = document.getElementById('password-field').textContent === '••••••••' ? 'GuestPass2024!' : '••••••••'">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Action Chips -->
<div class="flex gap-3 mt-4 w-full justify-center">
<button class="flex items-center gap-2 px-4 py-2 bg-surface rounded-full border border-outline-variant hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">content_copy</span>
<span class="font-label-md text-label-md text-on-surface">Copy Password</span>
</button>
<button class="flex items-center gap-2 px-4 py-2 bg-surface rounded-full border border-outline-variant hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">share</span>
<span class="font-label-md text-label-md text-on-surface">Share</span>
</button>
</div>
</section>
<!-- Safety Section -->
<section class="bg-surface rounded-xl border border-outline-variant/30 overflow-hidden shadow-sm">
<div class="p-4 flex items-start gap-4">
<div class="w-12 h-12 rounded-full bg-[#E6F4EA] flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[#137333] icon-fill">gpp_good</span>
</div>
<div class="flex-grow">
<div class="flex justify-between items-start mb-1">
<h3 class="font-headline-md text-headline-md text-on-surface">Safe</h3>
<span class="font-label-md text-label-md text-[#137333] bg-[#E6F4EA] px-2 py-0.5 rounded">100/100</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Local network verified. WPA3 security protocol detected.</p>
</div>
</div>
<!-- Check Password Leak Sub-row -->
<div class="border-t border-outline-variant/30 p-4 bg-surface-container-low flex justify-between items-center hover:bg-surface-container-high transition-colors cursor-pointer group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">lock_open</span>
<div>
<h4 class="font-label-md text-label-md text-on-surface">Check password leak</h4>
<p class="font-label-sm text-label-sm text-on-surface-variant">Verify against known breaches</p>
</div>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</div>
</section>
</main>
<!-- Bottom Actions (Sticky) -->
<footer class="mt-auto px-margin-mobile py-stack-lg bg-surface/90 backdrop-blur-md border-t border-outline-variant/30 sticky bottom-0 z-40">
<div class="max-w-2xl mx-auto flex flex-col gap-3">
<button class="w-full bg-primary hover:bg-primary-fixed-variant text-on-primary font-label-md text-label-md py-4 rounded-full shadow-[0_8px_24px_rgba(17,24,39,0.1)] transition-all active:scale-[0.98]">
                Connect to Network
            </button>
<button class="w-full bg-transparent hover:bg-surface-variant text-on-surface font-label-md text-label-md py-4 rounded-full border border-outline-variant transition-colors">
                Done
            </button>
</div>
</footer>
</body></html>
