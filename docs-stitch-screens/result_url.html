<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>QuickScan Pro - Scan Result</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#ffede6",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "surface-container-high": "#e1e8fd",
                        "on-tertiary-fixed": "#360f00",
                        "on-secondary-fixed": "#002113",
                        "surface-variant": "#dce2f7",
                        "surface": "#f9f9ff",
                        "on-primary-fixed": "#00174b",
                        "surface-container-low": "#f1f3ff",
                        "secondary": "#006c49",
                        "on-surface": "#141b2b",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#eeefff",
                        "surface-dim": "#d3daef",
                        "primary": "#004ac6",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#003ea8",
                        "primary-fixed-dim": "#b4c5ff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#6ffbbe",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#b4c5ff",
                        "tertiary": "#943700",
                        "on-secondary-container": "#00714d",
                        "on-background": "#141b2b",
                        "error": "#ba1a1a",
                        "outline": "#737686",
                        "surface-tint": "#0053db",
                        "surface-bright": "#f9f9ff",
                        "inverse-surface": "#293040",
                        "tertiary-fixed-dim": "#ffb596",
                        "inverse-on-surface": "#edf0ff",
                        "error-container": "#ffdad6",
                        "background": "#f9f9ff",
                        "surface-container-highest": "#dce2f7",
                        "secondary-container": "#6cf8bb",
                        "primary-fixed": "#dbe1ff",
                        "on-surface-variant": "#434655",
                        "outline-variant": "#c3c6d7",
                        "on-secondary-fixed-variant": "#005236",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#ffdbcd",
                        "secondary-fixed-dim": "#4edea3",
                        "primary-container": "#2563eb",
                        "surface-container": "#e9edff",
                        "tertiary-container": "#bc4800"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "0.5rem",
                        "gutter": "1rem",
                        "stack-md": "1rem",
                        "margin-mobile": "1.25rem",
                        "margin-desktop": "2rem",
                        "stack-lg": "1.5rem"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md text-body-md flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Transactional context, custom layout based on prompt) -->
<header class="flex justify-between items-center px-margin-mobile py-stack-md bg-transparent fixed top-0 w-full z-50">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<div class="bg-surface-variant px-3 py-1 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-sm text-on-surface-variant" data-icon="link">link</span>
<span class="font-label-md text-label-md text-on-surface-variant">URL</span>
</div>
<div class="w-12"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile pt-[88px] pb-stack-lg max-w-md mx-auto w-full">
<!-- Scanned Content Card -->
<section class="bg-surface-container-lowest rounded-xl p-stack-lg shadow-[0_8px_24px_rgba(17,24,39,0.05)] border border-outline-variant/20 mb-stack-lg flex flex-col items-center text-center mt-stack-md transition-transform hover:scale-[1.01] duration-300">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-stack-md">
<span class="material-symbols-outlined text-on-primary-container text-3xl" data-icon="public" data-weight="fill">public</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-2 break-all px-2">https://www.google.com</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Scanned today at 10:42 AM</p>
</section>
<!-- Action Chips -->
<section class="flex flex-wrap justify-center gap-stack-sm mb-stack-lg">
<button class="flex items-center gap-2 px-4 py-2 bg-surface-container border border-outline-variant/30 rounded-full hover:bg-surface-container-high transition-colors text-on-surface">
<span class="material-symbols-outlined text-lg" data-icon="content_copy">content_copy</span>
<span class="font-label-md text-label-md">Copy</span>
</button>
<button class="flex items-center gap-2 px-4 py-2 bg-surface-container border border-outline-variant/30 rounded-full hover:bg-surface-container-high transition-colors text-on-surface">
<span class="material-symbols-outlined text-lg" data-icon="share">share</span>
<span class="font-label-md text-label-md">Share</span>
</button>
<button class="flex items-center gap-2 px-4 py-2 bg-surface-container border border-outline-variant/30 rounded-full hover:bg-surface-container-high transition-colors text-on-surface">
<span class="material-symbols-outlined text-lg" data-icon="open_in_new">open_in_new</span>
<span class="font-label-md text-label-md">Open</span>
</button>
</section>
<!-- Safety Section -->
<section class="bg-surface-container-low rounded-xl p-stack-md border border-outline-variant/20 mb-stack-lg relative overflow-hidden">
<!-- Subtle safety green gradient accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-secondary to-secondary-container"></div>
<div class="flex items-center gap-3 mb-stack-sm">
<div class="w-8 h-8 rounded-full bg-secondary/10 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-xl" data-icon="gpp_good" data-weight="fill">gpp_good</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface">Safe</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">No threats detected</p>
</div>
</div>
<div class="mt-stack-sm">
<div class="flex justify-between items-center mb-1">
<span class="font-label-sm text-label-sm text-on-surface-variant">Safety Score</span>
<span class="font-label-sm text-label-sm text-secondary font-bold">95/100</span>
</div>
<div class="w-full bg-outline-variant/30 rounded-full h-1.5">
<div class="bg-secondary h-1.5 rounded-full" style="width: 95%"></div>
</div>
</div>
</section>
<div class="flex-1"></div> <!-- Spacer to push buttons to bottom -->
<!-- Bottom Actions -->
<section class="flex flex-col gap-stack-sm pb-safe mt-auto">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full shadow-[0_8px_24px_rgba(37,99,235,0.2)] hover:bg-primary-fixed-variant transition-colors flex justify-center items-center gap-2 scale-95 active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="open_in_browser">open_in_browser</span>
                Open Link
            </button>
<button class="w-full bg-transparent border border-outline-variant text-on-surface font-label-md text-label-md py-4 rounded-full hover:bg-surface-container-high transition-colors flex justify-center items-center scale-95 active:scale-90 duration-200">
                Done
            </button>
</section>
</main>
<!-- Navigation Shell Suppressed due to Transactional Intent (Scan Result) -->
</body></html>
