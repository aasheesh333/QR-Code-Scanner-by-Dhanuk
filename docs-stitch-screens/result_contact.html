<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>QuickScan Pro - Scan Result</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-container": "#ffede6",
                      "on-tertiary-fixed-variant": "#7d2d00",
                      "surface-container-high": "#e1e8fd",
                      "on-tertiary-fixed": "#360f00",
                      "on-secondary-fixed": "#002113",
                      "surface-variant": "#dce2f7",
                      "surface": "#f9f9ff",
                      "on-primary-fixed": "#00174b",
                      "surface-container-low": "#f1f3ff",
                      "secondary": "#006c49",
                      "on-surface": "#141b2b",
                      "on-secondary": "#ffffff",
                      "on-primary-container": "#eeefff",
                      "surface-dim": "#d3daef",
                      "primary": "#004ac6",
                      "on-error": "#ffffff",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed-variant": "#003ea8",
                      "primary-fixed-dim": "#b4c5ff",
                      "surface-container-lowest": "#ffffff",
                      "secondary-fixed": "#6ffbbe",
                      "on-primary": "#ffffff",
                      "inverse-primary": "#b4c5ff",
                      "tertiary": "#943700",
                      "on-secondary-container": "#00714d",
                      "on-background": "#141b2b",
                      "error": "#ba1a1a",
                      "outline": "#737686",
                      "surface-tint": "#0053db",
                      "surface-bright": "#f9f9ff",
                      "inverse-surface": "#293040",
                      "tertiary-fixed-dim": "#ffb596",
                      "inverse-on-surface": "#edf0ff",
                      "error-container": "#ffdad6",
                      "background": "#f9f9ff",
                      "surface-container-highest": "#dce2f7",
                      "secondary-container": "#6cf8bb",
                      "primary-fixed": "#dbe1ff",
                      "on-surface-variant": "#434655",
                      "outline-variant": "#c3c6d7",
                      "on-secondary-fixed-variant": "#005236",
                      "on-error-container": "#93000a",
                      "tertiary-fixed": "#ffdbcd",
                      "secondary-fixed-dim": "#4edea3",
                      "primary-container": "#2563eb",
                      "surface-container": "#e9edff",
                      "tertiary-container": "#bc4800"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-sm": "0.5rem",
                      "gutter": "1rem",
                      "stack-md": "1rem",
                      "margin-mobile": "1.25rem",
                      "margin-desktop": "2rem",
                      "stack-lg": "1.5rem"
              },
              "fontFamily": {
                      "label-sm": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "label-md": ["Inter"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                      "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for horizontal chips */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary selection:text-on-primary relative">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md flex justify-between items-center px-margin-mobile py-stack-md">
<button aria-label="Go back" class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[28px]" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex items-center justify-center bg-surface-container-high px-3 py-1 rounded-full border border-outline-variant/50 shadow-sm">
<span class="material-symbols-outlined text-primary text-[18px] mr-1" data-icon="contacts" data-weight="fill">contacts</span>
<span class="font-label-md text-label-md text-on-surface">vCard</span>
</div>
<div class="w-8"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col pt-24 px-margin-mobile pb-[140px] max-w-md mx-auto w-full gap-stack-lg">
<!-- Contact Identity Card -->
<section class="bg-surface-bright rounded-[24px] shadow-sm border border-outline-variant/30 p-stack-lg flex flex-col items-center text-center relative overflow-hidden group">
<!-- Decorative gradient blur -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 bg-primary/5 rounded-full blur-3xl -z-10 group-hover:bg-primary/10 transition-colors duration-500"></div>
<div class="w-24 h-24 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-stack-md shadow-inner border border-primary/10 relative">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">JD</span>
<!-- Abstract avatar placeholder if user prefers image, otherwise initials are cleaner for utility app -->
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-1">John Doe</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Senior Designer at Acme Corp</p>
<div class="w-full flex flex-col gap-stack-sm text-left">
<div class="flex items-center gap-stack-md p-stack-sm rounded-xl hover:bg-surface-container transition-colors cursor-pointer">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" data-icon="call" data-weight="fill">call</span>
</div>
<div class="flex-grow overflow-hidden">
<p class="font-label-sm text-label-sm text-on-surface-variant">Mobile</p>
<p class="font-body-md text-body-md text-on-surface truncate">+1 (234) 567-8900</p>
</div>
</div>
<div class="flex items-center gap-stack-md p-stack-sm rounded-xl hover:bg-surface-container transition-colors cursor-pointer">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" data-icon="mail" data-weight="fill">mail</span>
</div>
<div class="flex-grow overflow-hidden">
<p class="font-label-sm text-label-sm text-on-surface-variant">Work Email</p>
<p class="font-body-md text-body-md text-on-surface truncate">john.doe@example.com</p>
</div>
</div>
<div class="flex items-center gap-stack-md p-stack-sm rounded-xl hover:bg-surface-container transition-colors cursor-pointer">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" data-icon="location_on" data-weight="fill">location_on</span>
</div>
<div class="flex-grow overflow-hidden">
<p class="font-label-sm text-label-sm text-on-surface-variant">Address</p>
<p class="font-body-md text-body-md text-on-surface truncate">123 Tech Lane, SF, CA</p>
</div>
</div>
</div>
</section>
<!-- Quick Actions Chips -->
<section class="flex gap-stack-sm overflow-x-auto hide-scrollbar -mx-margin-mobile px-margin-mobile snap-x">
<button class="flex flex-col items-center justify-center gap-1 min-w-[80px] h-20 bg-surface-bright rounded-2xl border border-outline-variant/30 shadow-sm active:scale-95 transition-transform snap-center hover:bg-surface-container">
<span class="material-symbols-outlined text-primary text-[24px]" data-icon="call">call</span>
<span class="font-label-sm text-label-sm text-on-surface">Dial</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 min-w-[80px] h-20 bg-surface-bright rounded-2xl border border-outline-variant/30 shadow-sm active:scale-95 transition-transform snap-center hover:bg-surface-container">
<span class="material-symbols-outlined text-primary text-[24px]" data-icon="mail">mail</span>
<span class="font-label-sm text-label-sm text-on-surface">Email</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 min-w-[80px] h-20 bg-surface-bright rounded-2xl border border-outline-variant/30 shadow-sm active:scale-95 transition-transform snap-center hover:bg-surface-container">
<span class="material-symbols-outlined text-primary text-[24px]" data-icon="content_copy">content_copy</span>
<span class="font-label-sm text-label-sm text-on-surface">Copy</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 min-w-[80px] h-20 bg-surface-bright rounded-2xl border border-outline-variant/30 shadow-sm active:scale-95 transition-transform snap-center hover:bg-surface-container">
<span class="material-symbols-outlined text-primary text-[24px]" data-icon="share">share</span>
<span class="font-label-sm text-label-sm text-on-surface">Share</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 min-w-[80px] h-20 bg-surface-bright rounded-2xl border border-outline-variant/30 shadow-sm active:scale-95 transition-transform snap-center hover:bg-surface-container">
<span class="material-symbols-outlined text-primary text-[24px]" data-icon="map">map</span>
<span class="font-label-sm text-label-sm text-on-surface">Map</span>
</button>
</section>
<!-- Safety Inspection Bento Card -->
<section class="bg-surface-bright rounded-[24px] border border-secondary-container/50 shadow-sm p-stack-md flex items-center justify-between relative overflow-hidden">
<!-- Soft green ambient glow -->
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-32 h-full bg-secondary-container/20 blur-xl -z-10"></div>
<div class="flex items-center gap-stack-md z-10">
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined icon-filled text-[28px]" data-icon="check_circle">check_circle</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface flex items-center gap-1">
                        Safe Content
                    </h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">Standard contact format</p>
</div>
</div>
<div class="text-right z-10">
<span class="font-headline-md text-headline-md text-secondary block">98</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">/100</span>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area (Transactional, no nav shell) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-xl border-t border-outline-variant/20 pt-stack-md pb-[max(1rem,env(safe-area-inset-bottom))] px-margin-mobile z-50">
<div class="max-w-md mx-auto w-full flex flex-col gap-stack-sm">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-label-md text-label-md shadow-[0_8px_24px_rgba(37,99,235,0.2)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="person_add">person_add</span>
                Save Contact
            </button>
<button class="w-full h-12 bg-transparent text-primary rounded-xl font-label-md text-label-md border border-primary/20 hover:bg-primary/5 active:scale-[0.98] transition-all">
                Done
            </button>
</div>
</div>
</body></html>
