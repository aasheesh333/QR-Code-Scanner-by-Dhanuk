<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>QuickScan Pro - Onboarding 2</title>
<!-- Fonts and Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration (Lumina Utility / QuickScan Pro) -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-container": "#6cf8bb",
                    "tertiary": "#943700",
                    "surface-bright": "#f9f9ff",
                    "on-tertiary": "#ffffff",
                    "on-error-container": "#93000a",
                    "error-container": "#ffdad6",
                    "primary-fixed-dim": "#b4c5ff",
                    "primary": "#004ac6",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "secondary-fixed-dim": "#4edea3",
                    "outline-variant": "#c3c6d7",
                    "secondary": "#006c49",
                    "tertiary-fixed-dim": "#ffb596",
                    "outline": "#737686",
                    "tertiary-container": "#bc4800",
                    "surface-dim": "#d3daef",
                    "on-background": "#141b2b",
                    "surface-container": "#e9edff",
                    "on-secondary": "#ffffff",
                    "on-primary": "#ffffff",
                    "inverse-primary": "#b4c5ff",
                    "surface-tint": "#0053db",
                    "error": "#ba1a1a",
                    "primary-fixed": "#dbe1ff",
                    "on-secondary-fixed-variant": "#005236",
                    "on-primary-container": "#eeefff",
                    "on-surface": "#141b2b",
                    "on-secondary-fixed": "#002113",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-container": "#00714d",
                    "secondary-fixed": "#6ffbbe",
                    "on-tertiary-fixed": "#360f00",
                    "surface-container-highest": "#dce2f7",
                    "on-error": "#ffffff",
                    "surface": "#f9f9ff",
                    "inverse-on-surface": "#edf0ff",
                    "tertiary-fixed": "#ffdbcd",
                    "background": "#f9f9ff",
                    "surface-container-low": "#f1f3ff",
                    "on-surface-variant": "#434655",
                    "on-primary-fixed-variant": "#003ea8",
                    "on-primary-fixed": "#00174b",
                    "inverse-surface": "#293040",
                    "surface-container-high": "#e1e8fd",
                    "surface-variant": "#dce2f7",
                    "on-tertiary-container": "#ffede6",
                    "primary-container": "#2563eb"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "1rem",
                    "stack-lg": "1.5rem",
                    "margin-desktop": "2rem",
                    "margin-mobile": "1.25rem",
                    "stack-md": "1rem",
                    "stack-sm": "0.5rem"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Inter"],
                    "label-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-md": ["Inter"],
                    "headline-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-[884px] flex flex-col font-body-md antialiased overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- 
      TopAppBar (Re-used component structure, adapted for linear onboarding intent)
      Nav Shell is suppressed as this is a linear flow. Only rendering the Top Header.
    -->
<header class="w-full top-0 left-0 sticky bg-background flat no shadows flex items-center justify-between px-margin-mobile h-16 w-full z-10">
<!-- Leading Icon (Empty for centering balance, or invisible placeholder) -->
<div class="w-12 h-12 flex items-center justify-center">
<!-- No leading icon specified for onboarding, left empty to push skip right -->
</div>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">
<!-- Brand name omitted on this specific step as per typical onboarding flows focusing on content, but can be added if strict adherence to TopAppBar JSON is required. Skipping to keep focus on illustration -->
</h1>
<!-- Trailing Action -->
<button class="font-label-md text-label-md text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 duration-100 flex items-center justify-center px-2 py-1 rounded-full">
            Skip
        </button>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pb-8 relative z-0">
<!-- Ambient Background Glow (Lumina Utility style) -->
<div class="absolute inset-0 z-[-1] overflow-hidden pointer-events-none">
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-1/4 left-1/4 w-64 h-64 bg-secondary/5 rounded-full blur-[80px]"></div>
</div>
<!-- Illustration / Shield Theme -->
<div class="w-full max-w-sm mb-stack-lg relative flex justify-center items-center h-64">
<!-- Placeholder for a high-quality illustration. Using a styled generic placeholder to represent the security shield -->
<div class="relative w-48 h-48 flex items-center justify-center">
<!-- Abstract Shield Elements -->
<div class="absolute inset-0 bg-surface-container rounded-full animate-pulse opacity-50"></div>
<div class="absolute inset-4 bg-primary-container rounded-full shadow-lg flex items-center justify-center transform hover:scale-105 transition-transform duration-500 ease-in-out">
<span class="material-symbols-outlined text-[80px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">
                        shield_person
                    </span>
</div>
<!-- Floating protective nodes -->
<div class="absolute -top-4 -right-4 w-12 h-12 bg-secondary-container rounded-full flex items-center justify-center shadow-md animate-bounce" style="animation-duration: 3s;">
<span class="material-symbols-outlined text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">
                        check_circle
                    </span>
</div>
<div class="absolute -bottom-2 -left-2 w-10 h-10 bg-tertiary-container rounded-full flex items-center justify-center shadow-md animate-bounce" style="animation-duration: 4s; animation-delay: 1s;">
<span class="material-symbols-outlined text-on-tertiary-container text-sm" style="font-variation-settings: 'FILL' 1;">
                        lock
                    </span>
</div>
</div>
</div>
<!-- Typography Section -->
<div class="text-center w-full max-w-md mt-stack-md space-y-stack-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">
                Stay Safe
            </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto leading-relaxed">
                Every link and code is checked against known scams and phishing before you open it.
            </p>
</div>
</main>
<!-- Footer Area (Indicators & Button) -->
<footer class="w-full px-margin-mobile pb-margin-desktop pt-stack-md flex flex-col items-center gap-stack-lg bg-background relative z-10">
<!-- Dot Indicators -->
<div class="flex gap-2 items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full border border-outline-variant bg-transparent transition-all duration-300 ease-in-out"></div>
<!-- Active Dot -->
<div class="w-8 h-2.5 rounded-full bg-primary transition-all duration-300 ease-in-out"></div>
<div class="w-2.5 h-2.5 rounded-full border border-outline-variant bg-transparent transition-all duration-300 ease-in-out"></div>
</div>
<!-- Primary Action -->
<button class="w-full max-w-sm h-14 bg-primary hover:opacity-90 active:scale-[0.98] transition-all duration-200 rounded-full flex items-center justify-center font-label-md text-label-md text-on-primary shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
            Next
            <span class="material-symbols-outlined ml-2 text-xl">
                arrow_forward
            </span>
</button>
</footer>
</body></html>
