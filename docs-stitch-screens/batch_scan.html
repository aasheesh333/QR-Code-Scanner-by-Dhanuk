<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>QuickScan Pro - Batch Scan</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    </style>

          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-tint": "#0053db",
                      "on-primary-fixed-variant": "#003ea8",

                      "surface-container-lowest": "#ffffff",
                      "surface-container-high": "#e1e8fd",
                      "on-secondary": "#ffffff",
                      "on-primary": "#ffffff",
                      "inverse-primary": "#b4c5ff",
                      "inverse-on-surface": "#edf0ff",
                      "surface-variant": "#dce2f7",
                      "on-error-container": "#93000a",
                      "secondary-fixed-dim": "#4edea3",
                      "on-tertiary": "#ffffff",
                      "error": "#ba1a1a",
                      "tertiary": "#943700",
                      "tertiary-fixed": "#ffdbcd",
                      "primary-fixed-dim": "#b4c5ff",
                      "error-container": "#ffdad6",
                      "on-surface-variant": "#434655",
                      "on-primary-container": "#eeefff",
                      "on-error": "#ffffff",
                      "secondary-container": "#6cf8bb",
                      "primary": "#004ac6",
                      "surface-container-low": "#f1f3ff",
                      "surface-container-highest": "#dce2f7",
                      "on-secondary-fixed-variant": "#005236",
                      "on-background": "#141b2b",

                      "secondary-fixed": "#6ffbbe",
                      "on-primary-fixed": "#00174b",

                      "on-surface": "#141b2b",
                      "tertiary-container": "#bc4800",
                      "surface-bright": "#f9f9ff",
                      "surface": "#f9f9ff",
                      "surface-container": "#e9edff",
                      "background": "#f9f9ff",
                      "on-secondary-container": "#00714d",
                      "surface-dim": "#d3daef",
                      "inverse-surface": "#293040"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "1rem",
                      "margin-mobile": "1.25rem",
                      "stack-sm": "0.5rem",
                      "stack-md": "1rem",
                      "stack-lg": "1.5rem",
                      "margin-desktop": "2rem",
                      "safe": "env(safe-area-inset-bottom)"
              },
              "fontFamily": {
                      "body-lg": [
                              "Inter"
                      ],
                      "label-sm": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Inter"

                      "label-md": [
                              "Inter"
                      ],
                      "headline-lg-mobile": [
                              "Inter"

              "fontSize": {

                      "headline-lg": [

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md antialiased overflow-x-hidden min-h-screen pb-32">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md flex justify-between items-center px-margin-mobile py-stack-md">
<button class="text-primary hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface text-center flex-1">Batch Scan</h1>
<button class="text-primary hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="sort">sort</span>
</button>
</header>
<!-- Main Content -->
<main class="pt-24 px-margin-mobile flex flex-col gap-stack-lg max-w-md mx-auto">
<!-- Summary Banner -->
<section class="bg-surface-container rounded-xl p-4 flex flex-col gap-stack-sm shadow-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Session Summary</h2>
<div class="grid grid-cols-3 gap-2 text-center">
<div class="flex flex-col items-center bg-surface rounded-lg p-2">
<span class="font-headline-md text-headline-md text-primary">12</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Scanned</span>
</div>
<div class="flex flex-col items-center bg-surface rounded-lg p-2">
<div class="flex items-center gap-1">
<div class="w-2 h-2 rounded-full bg-tertiary"></div>
<span class="font-headline-md text-headline-md text-tertiary">3</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Duplicates</span>
</div>
<div class="flex flex-col items-center bg-surface rounded-lg p-2">
<div class="flex items-center gap-1">
<div class="w-2 h-2 rounded-full bg-secondary"></div>
<span class="font-headline-md text-headline-md text-secondary">9</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Unique</span>
</div>
</div>
</section>
<!-- Session Control -->
<div class="flex justify-center w-full">
<button class="flex items-center justify-center gap-2 border border-outline text-primary px-6 py-2 rounded-full font-label-md text-label-md hover:bg-surface-variant transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-[20px]" data-icon="pause">pause</span>
                Pause Batch
            </button>
</div>
<!-- Scanned List -->
<section class="flex flex-col gap-0 bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden">
<!-- Row 1 -->
<div class="flex items-center gap-3 p-4 border-b border-outline-variant/30 hover:bg-surface-container-low transition-colors">
<div class="bg-primary-container text-on-primary-container p-2 rounded-full flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" data-icon="link">link</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-label-md text-label-md text-on-surface truncate">https://google.com</p>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant whitespace-nowrap">12:05 PM</span>
</div>
<!-- Row 2 -->
<div class="flex items-center gap-3 p-4 border-b border-outline-variant/30 bg-surface-container hover:bg-surface-container-high transition-colors">
<div class="bg-surface-variant text-on-surface-variant p-2 rounded-full flex-shrink-0 opacity-70">
<span class="material-symbols-outlined text-[20px]" data-icon="wifi">wifi</span>
</div>
<div class="flex-1 min-w-0 flex flex-col gap-0.5">
<p class="font-label-md text-label-md text-on-surface truncate opacity-70">Home-WiFi-2.4G</p>
<div class="flex items-center gap-1">
<div class="w-1.5 h-1.5 rounded-full bg-tertiary"></div>
<span class="font-label-sm text-label-sm text-tertiary">Duplicate</span>
</div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant whitespace-nowrap opacity-70">12:06 PM</span>
</div>
<!-- Row 3 -->
<div class="flex items-center gap-3 p-4 border-b border-outline-variant/30 hover:bg-surface-container-low transition-colors">
<div class="bg-secondary-container text-on-secondary-container p-2 rounded-full flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-label-md text-label-md text-on-surface truncate">John Doe (vCard)</p>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant whitespace-nowrap">12:07 PM</span>
</div>
<!-- Row 4 -->
<div class="flex items-center gap-3 p-4 border-b border-outline-variant/30 hover:bg-surface-container-low transition-colors">
<div class="bg-primary-container text-on-primary-container p-2 rounded-full flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" data-icon="link">link</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-label-md text-label-md text-on-surface truncate">https://amazon.com/product/123</p>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant whitespace-nowrap">12:08 PM</span>
</div>
<!-- Row 5 -->
<div class="flex items-center gap-3 p-4 bg-surface-container hover:bg-surface-container-high transition-colors">
<div class="bg-surface-variant text-on-surface-variant p-2 rounded-full flex-shrink-0 opacity-70">
<span class="material-symbols-outlined text-[20px]" data-icon="wifi">wifi</span>
</div>
<div class="flex-1 min-w-0 flex flex-col gap-0.5">
<p class="font-label-md text-label-md text-on-surface truncate opacity-70">Home-WiFi-2.4G</p>
<div class="flex items-center gap-1">
<div class="w-1.5 h-1.5 rounded-full bg-tertiary"></div>
<span class="font-label-sm text-label-sm text-tertiary">Duplicate</span>
</div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant whitespace-nowrap opacity-70">12:09 PM</span>
</div>
</section>
</main>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-20 w-full px-margin-mobile z-40 max-w-md left-1/2 -translate-x-1/2">
<div class="flex gap-4 p-4 bg-surface/90 backdrop-blur-md rounded-2xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant/20">
<button class="flex-1 py-3 px-4 rounded-full border border-outline text-on-surface font-label-md text-label-md flex justify-center items-center hover:bg-surface-variant transition-colors active:scale-95">
                Discard
            </button>
<button class="flex-1 py-3 px-4 rounded-full bg-primary text-on-primary font-label-md text-label-md flex justify-center items-center hover:bg-primary-container hover:text-on-primary-container transition-colors active:scale-95 shadow-[0_4px_12px_rgba(0,74,198,0.3)]">
                Save All
            </button>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface/90 dark:bg-inverse-surface/90 backdrop-blur-xl border-t border-outline-variant/30 shadow-lg flex justify-around items-center px-2 py-3 pb-safe md:hidden">
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-3 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200 ease-in-out">
<span class="material-symbols-outlined text-[24px]" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200 ease-in-out">
<span class="material-symbols-outlined text-[24px]" data-icon="add_box">add_box</span>
<span class="font-label-sm text-label-sm mt-1">Generate</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200 ease-in-out">
<span class="material-symbols-outlined text-[24px]" data-icon="history">history</span>
<span class="font-label-sm text-label-sm mt-1">History</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200 ease-in-out">
<span class="material-symbols-outlined text-[24px]" data-icon="insights">insights</span>
<span class="font-label-sm text-label-sm mt-1">Analytics</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-200 ease-in-out">
<span class="material-symbols-outlined text-[24px]" data-icon="settings">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</button>
</nav>
</body></html>
