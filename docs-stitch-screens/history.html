<body class="bg-background text-on-background antialiased flex justify-center">
<!-- Mobile Device Container for web preview context -->
<div class="relative w-full max-w-md h-screen overflow-hidden bg-background shadow-2xl flex flex-col sm:border-x sm:border-outline-variant/30">
<!-- TopAppBar (from JSON Shared Components) -->
<header class="fixed top-0 w-full max-w-md z-50 bg-surface/80 backdrop-blur-md flex justify-between items-center px-margin-mobile py-stack-md">
<button class="text-primary scale-95 active:scale-90 transition-transform hover:opacity-80">
<span class="material-symbols-outlined">qr_code_scanner</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">QuickScan Pro</h1>
<button class="text-primary scale-95 active:scale-90 transition-transform hover:opacity-80">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto mt-[76px] mb-[84px] flex flex-col gap-stack-lg px-margin-mobile pt-stack-sm pb-stack-lg">
<!-- Contextual Page Header & Actions -->
<div class="flex justify-between items-center w-full">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">History</h2>
<div class="flex gap-2 text-on-surface-variant">
<button aria-label="Vault" class="p-2 hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined">lock</span>
</button>
<button aria-label="Compare" class="p-2 hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined">compare_arrows</span>
</button>
</div>
</div>
<!-- Search Bar -->
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="Search history..." type="text"/>
</div>
<!-- Scan List Container -->
<div class="flex flex-col bg-surface-bright rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden">
<!-- Row 1: URL -->
<div class="group flex items-center justify-between p-4 border-b border-surface-variant/50 hover:bg-surface-container-low transition-colors cursor-pointer">
<div class="flex items-center gap-3 overflow-hidden">
<div class="w-12 h-12 shrink-0 bg-surface-container rounded-xl flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">link</span>
</div>
<div class="flex flex-col overflow-hidden pr-2">
<span class="font-label-md text-label-md text-on-surface truncate">https://www.google.com</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Today, 10:42 AM</span>
</div>
</div>
<div class="flex items-center gap-1 shrink-0">
<button class="p-2 text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined">star</span>
</button>
<button class="p-2 text-outline hover:text-error transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
<!-- Row 2: Wi-Fi -->
<div class="group flex items-center justify-between p-4 border-b border-surface-variant/50 hover:bg-surface-container-low transition-colors cursor-pointer">
<div class="flex items-center gap-3 overflow-hidden">
<div class="w-12 h-12 shrink-0 bg-surface-container rounded-xl flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">wifi</span>
</div>
<div class="flex flex-col overflow-hidden pr-2">
<span class="font-label-md text-label-md text-on-surface truncate">Office_Guest</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Yesterday, 3:15 PM</span>
</div>
</div>
<div class="flex items-center gap-1 shrink-0">
<button class="p-2 text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="p-2 text-outline hover:text-error transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>

<div class="w-12 h-12 shrink-0 bg-surface-container rounded-xl flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">person</span>
</div>
<div class="flex flex-col overflow-hidden pr-2">
<span class="font-label-md text-label-md text-on-surface truncate">John Doe - Acme Corp</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Jul 28, 2026</span>
</div>
</div>
<div class="flex items-center gap-1 shrink-0">
<button class="p-2 text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined">star</span>
</button>
<button class="p-2 text-outline hover:text-error transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>

<div class="w-12 h-12 shrink-0 bg-surface-container rounded-xl flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">description</span>
</div>
<div class="flex flex-col overflow-hidden pr-2">
<span class="font-label-md text-label-md text-on-surface truncate">Meeting notes for Q3...</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Jul 25, 2026</span>
</div>
</div>
<div class="flex items-center gap-1 shrink-0">
<button class="p-2 text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined">star</span>
</button>
<button class="p-2 text-outline hover:text-error transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
