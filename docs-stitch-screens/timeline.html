<script>
        // Simple scroll shadow logic for TopAppBar
        const topAppBar = document.getElementById('top-app-bar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                topAppBar.classList.add('shadow-sm');
                topAppBar.classList.remove('bg-surface/80');
                topAppBar.classList.add('bg-surface/95');
            } else {
                topAppBar.classList.remove('shadow-sm');
                topAppBar.classList.add('bg-surface/80');
                topAppBar.classList.remove('bg-surface/95');
            }
        });
    </script>
