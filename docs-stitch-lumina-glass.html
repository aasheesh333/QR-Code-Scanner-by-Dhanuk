<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Premium QR Scanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #121414;
            overflow: hidden; /* App-like feel */
        }

        .glass-card {
            background: rgba(59, 70, 101, 0.2);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.10);
        }

        .glass-card-glow {
            box-shadow: 0 0 20px rgba(112, 11, 151, 0.2);
        }

        .scanning-beam {
            background: linear-gradient(to right, transparent, #700b97, transparent);
            height: 2px;
            width: 100%;
            position: absolute;
            animation: scan 3s ease-in-out infinite;
            box-shadow: 0 0 15px #700b97;
        }

        @keyframes scan {
            0%, 100% { top: 0%; opacity: 0; }
            10%, 90% { opacity: 1; }
            50% { top: 100%; }
        }

        @keyframes pulse-bracket {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(112, 11, 151, 0.5)); border-color: rgba(112, 11, 151, 0.5); }
            50% { filter: drop-shadow(0 0 15px rgba(112, 11, 151, 1)); border-color: rgba(112, 11, 151, 1); }
        }

        .corner-bracket {
            width: 40px;
            height: 40px;
            border-color: #700b97;
            animation: pulse-bracket 2s infinite;
        }

        .shimmer-border {
            position: relative;
        }
        .shimmer-border::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(90deg, transparent, #700b97, transparent);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        
        .bg-shader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }
    </style>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "tertiary": "#c6c4df",
                "inverse-surface": "#e2e2e2",
                "surface-dim": "#121414",
                "on-primary-fixed-variant": "#720f99",

                "on-tertiary": "#2f2e43",

                "secondary": "#bbc5eb",
                "on-secondary-fixed-variant": "#3b4665",
                "surface-container-low": "#1a1c1c",
                "on-background": "#e2e2e2",
                "error-container": "#93000a",
                "surface-container-highest": "#333535",
                "tertiary-fixed-dim": "#c6c4df",
                "primary-fixed-dim": "#ecb2ff",
                "primary": "#ecb2ff",
                "on-surface": "#e2e2e2",
                "tertiary-fixed": "#e2e0fc",
                "primary-fixed": "#f8d8ff",
                "surface-container": "#1e2020",
                "on-secondary-container": "#aab4d9",
                "on-error": "#690005",
                "on-primary-container": "#e295ff",
                "on-tertiary-fixed-variant": "#45455b",
                "on-tertiary-fixed": "#1a1a2e",
                "on-primary-fixed": "#320047",
                "on-primary": "#520071",
                "surface-bright": "#38393a",
                "on-error-container": "#ffdad6",
                "secondary-fixed": "#dae1ff",
                "inverse-on-surface": "#2f3131",
                "surface-container-lowest": "#0d0e0f",
                "on-surface-variant": "#d2c1d3",
                "inverse-primary": "#8d33b3",
                "on-secondary": "#252f4d",
                "on-secondary-fixed": "#0f1a37",
                "outline-variant": "#4e4351",
                "surface-variant": "#333535",
                "secondary-container": "#3b4665",
                "surface-tint": "#ecb2ff",
                "outline": "#9b8c9c",
                "secondary-fixed-dim": "#bbc5eb"
        },
        "borderRadius": {
                "DEFAULT": "1rem",
                "lg": "2rem",
                "xl": "3rem",
                "full": "9999px"
        },
        "spacing": {
                "lg": "40px",
                "xl": "64px",
                "sm": "12px",
                "container-padding": "20px",
                "base": "8px",
                "gutter": "16px",
                "xs": "4px",
                "md": "24px"
        },
        "fontFamily": {
                "body-md": [
                        "Inter"
                ],
                "headline-lg-mobile": [
                        "Inter"
                ],
                "headline-lg": [

                ],
                "mono-label": [
                        "Inter"

                "display-lg": [

                ]
        },
        "fontSize": {

                ],

                        "24px",

                                "lineHeight": "32px",

                                "fontWeight": "600"
                        }
                ],
                "headline-lg": [
                        "32px",
                        {
                                "lineHeight": "40px",
                                "letterSpacing": "-0.01em",
                                "fontWeight": "600"
                        }
                ],
                "mono-label": [
                        "13px",
                        {

                                "letterSpacing": "0.05em",

                "label-caps": [
                        "12px",

                                "lineHeight": "16px",

                        }
                ],
                "display-lg": [
                        "48px",
                        {
                                "lineHeight": "56px",
                                "letterSpacing": "-0.02em",
                                "fontWeight": "700"
                        }
                ]
        }
},
    },
  }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- Atmospheric Background Animation -->
<div class="bg-shader">{{DATA:ANIMATION:ANIMATION_1}}</div>
<!-- TopAppBar -->
<header class="w-full top-0 sticky backdrop-blur-md bg-transparent z-50 flex items-center justify-between px-container-padding py-sm">
<div class="flex-1"></div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background tracking-tight">Scanner</h1>
<div class="flex-1 flex justify-end">
<button class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-on-surface-variant hover:text-on-background transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<main class="flex-1 w-full max-w-md px-container-padding flex flex-col items-center justify-center gap-lg z-10 py-md relative">
<!-- Viewfinder Container -->
<div class="relative w-full aspect-square max-w-[340px] group">
<!-- Viewfinder Area -->
<div class="absolute inset-0 rounded-[2rem] overflow-hidden glass-card glass-card-glow bg-surface-container-lowest/20 backdrop-blur-md">
<!-- Mock Camera Feed Image -->
<div class="w-full h-full opacity-40 bg-cover bg-center transition-opacity duration-700" data-alt="A sophisticated macro close-up of a high-tech digital surface with glowing data lines and a sense of depth, set in a premium fintech aesthetic with deep violet and indigo colors. The lighting is moody and focused, evoking high-security and professional digital craftsmanship." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBlXWcDHZqtbimCNKjSCKh9_KKoRI2VYQeGHRqzeKBoJIIN9d3jCOXtmsiXxr443mVjlw-0sTN5GaMLPuJIUOj1pwQ2dB6MabCNjJmBMBPi2G8E_L1ktSZVE_hEalpVpl_nlGtY7wP0Lop1dP9u6eQNlD0k3LZ3jxCHkJvDkuNnKhjel28WG5VfXB6NjtMinPTmKoMrbmR6m8_FKX6bpGsbSDvLKgsdYvKkbDToUEnOzBCMqdKWnVmA')"></div>
<!-- Scanning Beam -->
<div class="scanning-beam"></div>
<!-- Dark Overlays (outside brackets effect) -->
<div class="absolute inset-0 bg-black/20 pointer-events-none"></div>
</div>
<!-- Corner Brackets -->
<div class="absolute -top-1 -left-1 corner-bracket border-t-2 border-l-2 rounded-tl-[2rem]"></div>
<div class="absolute -top-1 -right-1 corner-bracket border-t-2 border-r-2 rounded-tr-[2rem]"></div>
<div class="absolute -bottom-1 -left-1 corner-bracket border-b-2 border-l-2 rounded-bl-[2rem]"></div>
<div class="absolute -bottom-1 -right-1 corner-bracket border-b-2 border-r-2 rounded-br-[2rem]"></div>
<!-- Floating Tool Buttons -->
<div class="absolute -left-6 top-1/2 -translate-y-1/2 flex flex-col gap-md z-20">
<button class="w-12 h-12 rounded-full glass-card flex items-center justify-center text-on-surface hover:text-[#700b97] transition-all active:scale-90 shadow-xl border-white/10">
<span class="material-symbols-outlined" data-icon="flashlight_on">flashlight_on</span>
</button>
</div>
<div class="absolute -right-6 top-1/2 -translate-y-1/2 flex flex-col gap-md z-20">
<button class="w-12 h-12 rounded-full glass-card flex items-center justify-center text-on-surface hover:text-[#700b97] transition-all active:scale-90 shadow-xl border-white/10">
<span class="material-symbols-outlined" data-icon="image">image</span>
</button>
</div>
</div>
<!-- Feedback UI -->
<div class="text-center animate-pulse">
<p class="font-body-md text-on-surface-variant opacity-80">Align QR code within the frame</p>
</div>
<!-- Action Cards Grid -->
<div class="w-full grid grid-cols-2 gap-gutter">
<!-- Primary Scan Card -->
<div class="shimmer-border rounded-lg group cursor-pointer active:scale-95 transition-transform overflow-hidden">
<div class="glass-card h-32 flex flex-col items-start justify-between p-md bg-[#700b97]/10 group-hover:bg-[#700b97]/20 transition-colors">
<div class="w-10 h-10 rounded-full bg-[#700b97]/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="add_box" style="font-variation-settings: 'FILL' 1;">add_box</span>
</div>
<div>
<h3 class="font-headline-lg-mobile text-[18px] text-primary leading-tight">Scan Next</h3>
<p class="font-label-caps text-[10px] text-primary/60 uppercase tracking-widest mt-xs">Immediate</p>
</div>
</div>
</div>
<!-- Secondary Batch Card -->
<div class="shimmer-border rounded-lg group cursor-pointer active:scale-95 transition-transform overflow-hidden">
<div class="glass-card h-32 flex flex-col items-start justify-between p-md hover:bg-white/5 transition-colors">
<div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-on-surface-variant group-hover:text-primary">
<span class="material-symbols-outlined" data-icon="layers">layers</span>
</div>
<div>
<h3 class="font-headline-lg-mobile text-[18px] text-on-surface leading-tight">Batch Scan</h3>
<p class="font-label-caps text-[10px] text-on-surface-variant/60 uppercase tracking-widest mt-xs">Multi-entry</p>
</div>
</div>
</div>
</div>
<!-- Recent Activity Mini List -->
<div class="w-full mt-sm">
<div class="flex items-center justify-between mb-sm">
<h4 class="font-label-caps text-label-caps text-on-surface-variant">Recent History</h4>
<button class="text-primary font-label-caps text-xs hover:text-primary-fixed transition-colors">View all</button>
</div>
<div class="space-y-base">
<div class="glass-card p-sm flex items-center gap-sm rounded-lg border-white/10 hover:bg-white/5 transition-colors cursor-pointer">
<div class="w-10 h-10 rounded bg-white/5 flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined" data-icon="link">link</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-mono-label text-on-surface truncate">https://pay.gateway.premium/tx_902...</p>
<p class="text-[11px] text-on-surface-variant opacity-60">Today, 10:42 AM</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[18px]" data-icon="chevron_right">chevron_right</span>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-lg left-0 right-0 mx-auto w-[calc(100%-40px)] max-w-md z-50 flex justify-around items-center py-xs glass-card rounded-full shadow-[0_0_20px_rgba(112,11,151,0.1)]">
<div class="bg-[#700b97] text-white rounded-full p-3 active:scale-95 transition-all duration-300 shadow-lg shadow-[#700b97]/30">
<span class="material-symbols-outlined" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
</div>
<div class="text-on-surface-variant p-3 hover:bg-white/5 hover:text-on-surface active:scale-95 transition-all duration-300 rounded-full">
<span class="material-symbols-outlined" data-icon="history">history</span>
</div>
<div class="text-on-surface-variant p-3 hover:bg-white/5 hover:text-on-surface active:scale-95 transition-all duration-300 rounded-full">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<div class="text-on-surface-variant p-3 hover:bg-white/5 hover:text-on-surface active:scale-95 transition-all duration-300 rounded-full">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
</nav>
<!-- Interactive script for feedback -->
<script>
        // Haptic feedback simulator
        document.querySelectorAll('button, .cursor-pointer').forEach(btn => {
            btn.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });

        // Simulating viewfinder light pulse on "active" scan
        const beam = document.querySelector('.scanning-beam');
        setInterval(() => {
            beam.style.filter = `drop-shadow(0 0 ${Math.random() * 10 + 10}px #700b97)`;
        }, 100);
    </script>
</body></html>
