plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

def getAppConfig(String propName, String defaultValue) {
    def envVar = System.getenv(propName)
    if (envVar != null && !envVar.isEmpty()) {
        return envVar
    }

    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withInputStream { stream ->
            localProperties.load(stream)
        }
        def propValue = localProperties.getProperty(propName)
        if (propValue != null && !propValue.isEmpty()) {
            return propValue
        }
    }

    // Fallback: Check app/local.properties if not found in root
    def appLocalPropertiesFile = file('local.properties')
    if (appLocalPropertiesFile.exists()) {
         def appProps = new Properties()
         appLocalPropertiesFile.withInputStream { stream ->
            appProps.load(stream)
        }
        def propValue = appProps.getProperty(propName)
        if (propValue != null && !propValue.isEmpty()) {
            return propValue
        }
    }

    return defaultValue
}

android {
    namespace 'com.dhanuk.quickscanpro'
    compileSdk 34

    defaultConfig {
        applicationId "com.dhanuk.quickscanpro"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // AdMob Config
        def admobAppId = getAppConfig("ADMOB_APP_ID", "ca-app-pub-3940256099942544~3347511713")
        def bannerAdId = getAppConfig("ADMOB_BANNER_ID", "ca-app-pub-3940256099942544/6300978111")
        def interstitialAdId = getAppConfig("ADMOB_INTERSTITIAL_ID", "ca-app-pub-3940256099942544/1033173712")

        manifestPlaceholders = [admobAppId: admobAppId]

        buildConfigField "String", "BANNER_AD_ID", "\"$bannerAdId\""
        buildConfigField "String", "INTERSTITIAL_AD_ID", "\"$interstitialAdId\""
    }

    signingConfigs {
        release {
            def ksFilePath = getAppConfig("KEYSTORE_FILE", "")
            def ksPassword = getAppConfig("KEYSTORE_PASSWORD", "")
            def kAlias = getAppConfig("KEY_ALIAS", "")
            def kPassword = getAppConfig("KEY_PASSWORD", "")

            if (ksFilePath) {
                storeFile file(ksFilePath)
                storePassword ksPassword
                keyAlias kAlias
                keyPassword kPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation "androidx.compose.ui:ui:1.6.0"
    implementation "androidx.compose.material3:material3:1.2.0"
    implementation "androidx.compose.ui:ui-tooling-preview:1.6.0"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation "androidx.navigation:navigation-compose:2.7.6"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // CameraX
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "com.google.guava:guava:31.1-android"

    // ML Kit Barcode Scanning
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // Room
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:22.6.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.6.0"
    debugImplementation "androidx.compose.ui:ui-tooling:1.6.0"
}
