plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def getAppConfig(String propName, String defaultValue) {
    def envVar = System.getenv(propName)
    if (envVar != null && !envVar.isEmpty()) {
        return envVar
    }

    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withInputStream { stream ->
            localProperties.load(stream)
        }
        def propValue = localProperties.getProperty(propName)
        if (propValue != null && !propValue.isEmpty()) {
            return propValue
        }
    }

    def appLocalPropertiesFile = file('local.properties')
    if (appLocalPropertiesFile.exists()) {
        def appProps = new Properties()
        appLocalPropertiesFile.withInputStream { stream ->
            appProps.load(stream)
        }
        def propValue = appProps.getProperty(propName)
        if (propValue != null && !propValue.isEmpty()) {
            return propValue
        }
    }

    return defaultValue
}

android {
    namespace 'com.dhanuk.quickscanpro'
    compileSdk 36

    def admobAppId = getAppConfig("ADMOB_APP_ID", "ca-app-pub-3940256099942544~3347511713")
    def bannerAdId = getAppConfig("ADMOB_BANNER_ID", "ca-app-pub-3940256099942544/6300978111")
    def interstitialAdId = getAppConfig("ADMOB_INTERSTITIAL_ID", "ca-app-pub-3940256099942544/1033173712")
    def rewardedAdId = getAppConfig("ADMOB_REWARDED_ID", "ca-app-pub-3940256099942544/5224354917")
    def onesignalAppId = getAppConfig("ONESIGNAL_APP_ID", "placeholder-onesignal-app-id")

    defaultConfig {
        applicationId "com.dhanuk.quickscanpro"
        minSdk 23
        targetSdk 36
        versionCode 8
        versionName "3.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        manifestPlaceholders = [admobAppId: admobAppId]

        buildConfigField "String", "BANNER_AD_ID", "\"$bannerAdId\""
        buildConfigField "String", "INTERSTITIAL_AD_ID", "\"$interstitialAdId\""
        buildConfigField "String", "REWARDED_AD_ID", "\"$rewardedAdId\""
        buildConfigField "String", "ONESIGNAL_APP_ID", "\"$onesignalAppId\""
    }

    signingConfigs {
        release {
            def ksFilePath = getAppConfig("KEYSTORE_FILE", "")
            def ksPassword = getAppConfig("KEYSTORE_PASSWORD", "")
            def kAlias = getAppConfig("KEY_ALIAS", "")
            def kPassword = getAppConfig("KEY_PASSWORD", "")

            if (ksFilePath) {
                storeFile file(ksFilePath)
                storePassword ksPassword
                keyAlias kAlias
                keyPassword kPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            debuggable true
        }
    }

    lint {
        // Report issues but never fail the CI build on lint warnings.
        abortOnError false
        checkReleaseBuilds false
        htmlReport true
    }

    // Guard: never ship release builds with Google's public test ad IDs.
    // Only block actual packaging tasks so compileReleaseKotlin / lintRelease can
    // run locally for verification without real credentials.
    def testIds = [
        "ca-app-pub-3940256099942544~3347511713",
        "ca-app-pub-3940256099942544/6300978111",
        "ca-app-pub-3940256099942544/1033173712"
    ]
    if (gradle.startParameter.taskNames.any {
        def t = it.toLowerCase()
        t.contains('assemblerelease') || t.contains('packagerelease') || t.contains('bundlerelease') || t.contains('assemble') && t.contains('release')
    }) {
        if (admobAppId in testIds || bannerAdId in testIds || interstitialAdId in testIds) {
            throw new GradleException(
                "Release build aborted: AdMob test IDs detected. " +
                "Set ADMOB_APP_ID, ADMOB_BANNER_ID and ADMOB_INTERSTITIAL_ID."
            )
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/index.list'
            excludes += '/META-INF/DEPENDENCIES'
        }
    }
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

