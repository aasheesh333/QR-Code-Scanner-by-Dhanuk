<script>
        // Micro-interaction: Selection logic
        const cards = document.querySelectorAll('.template-card');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                // Remove selected state from all
                cards.forEach(c => {
                    c.classList.remove('border-primary', 'shadow-sm');
                    c.classList.add('border-transparent');
                    const icon = c.querySelector('.material-symbols-outlined.text-primary');
                    if (icon) icon.parentElement.remove();
                    const label = c.querySelector('span:last-child');
                    label.classList.remove('text-on-surface', 'font-semibold');
                    label.classList.add('text-on-surface-variant', 'font-medium');
                });

                // Add to clicked
                card.classList.remove('border-transparent');
                card.classList.add('border-primary', 'shadow-sm');
                
                const checkIconDiv = document.createElement('div');
                checkIconDiv.className = 'absolute top-2 right-2';
                checkIconDiv.innerHTML = '<span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings: \'FILL\' 1;">check_circle</span>';
                card.appendChild(checkIconDiv);

                const label = card.querySelector('span:last-child');
                label.classList.remove('text-on-surface-variant', 'font-medium');
                label.classList.add('text-on-surface', 'font-semibold');
            });
        });
    </script>
