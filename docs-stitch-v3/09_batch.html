<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Batch Scan - QuickScan Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary": "#5c5d72",
                    "secondary-dim": "#505166",
                    "outline-variant": "#b1b1ba",
                    "on-primary-container": "#001367",
                    "on-tertiary-fixed": "#523147",
                    "on-surface-variant": "#5d5f66",
                    "primary-dim": "#3749ad",
                    "on-tertiary-container": "#67435b",
                    "tertiary": "#79546c",
                    "on-tertiary": "#fff7f8",
                    "secondary-fixed": "#e1e0f9",
                    "primary-fixed": "#8596ff",
                    "primary-container": "#8596ff",
                    "inverse-primary": "#8596ff",
                    "tertiary-fixed": "#ffcfec",
                    "on-error": "#fff7f7",
                    "on-tertiary-fixed-variant": "#714d64",
                    "on-secondary-fixed-variant": "#595a6f",
                    "on-primary": "#faf8ff",
                    "surface-container-high": "#e8e7ef",
                    "error-dim": "#6b0221",
                    "tertiary-fixed-dim": "#f0c1de",
                    "surface-container-highest": "#e2e2eb",
                    "on-secondary-fixed": "#3d3e51",
                    "outline": "#797a82",
                    "surface-variant": "#e2e2eb",
                    "surface-bright": "#faf8fd",
                    "on-primary-fixed": "#000000",
                    "surface": "#faf8fd",
                    "on-surface": "#303239",
                    "surface-container": "#eeedf4",
                    "inverse-on-surface": "#9d9ca1",
                    "tertiary-container": "#ffcfec",
                    "secondary-container": "#e1e0f9",
                    "on-secondary": "#fbf8ff",
                    "surface-container-low": "#f4f3f9",
                    "surface-container-lowest": "#ffffff",
                    "surface-dim": "#d9d9e2",
                    "inverse-surface": "#0d0e11",
                    "surface-tint": "#4456ba",
                    "error": "#a8364b",
                    "primary-fixed-dim": "#7789f0",
                    "on-secondary-container": "#4f5065",
                    "primary": "#4456ba",
                    "secondary-fixed-dim": "#d3d2eb",
                    "error-container": "#f97386",
                    "tertiary-dim": "#6c485f",
                    "on-primary-fixed-variant": "#001a80",
                    "on-error-container": "#6e0523",
                    "on-background": "#303239",
                    "background": "#faf8fd"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "display": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scanner-frame {
            position: relative;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.4);
        }
        .scanning-line {
            height: 2px;
            background: linear-gradient(to right, transparent, #4456ba, transparent);
            box-shadow: 0 0 8px #4456ba;
            animation: scan 2.5s infinite linear;
        }
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-6 h-16 w-full sticky top-0 z-50 bg-surface">
<div class="flex items-center gap-4">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline text-xl font-bold text-on-surface">Batch Scan</h1>
</div>
<button class="p-2 -mr-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-primary">done</span>
</button>
</header>
<main class="flex-1 overflow-y-auto hide-scrollbar px-6 pb-24">
<!-- Progress Card -->
<section class="mt-4 mb-6">
<div class="bg-surface-container-lowest border border-surface-container-high rounded-xl p-4 shadow-sm">
<div class="flex justify-between items-end mb-2">
<span class="text-on-surface font-semibold text-lg">3 of 10 scanned</span>
<span class="text-secondary text-sm font-medium">30%</span>
</div>
<div class="w-full bg-surface-container-high rounded-full h-2.5 overflow-hidden">
<div class="bg-primary h-full rounded-full transition-all duration-700 ease-out" style="width: 30%"></div>
</div>
<p class="text-on-surface-variant text-sm mt-3 flex items-center gap-1.5">
<span class="material-symbols-outlined text-primary text-base">info</span>
                    Keep scanning to add more
                </p>
</div>
</section>
<!-- Camera Viewport Area -->
<section class="relative rounded-[2rem] overflow-hidden aspect-square w-full max-w-sm mx-auto bg-black mb-8 shadow-xl">
<!-- Simulated Camera Feed -->
<div class="absolute inset-0 bg-cover bg-center opacity-70" data-alt="A POV shot from a smartphone camera looking down at a cluttered desk with various papers and a laptop. A high-contrast QR code is prominently visible on a white envelope in the center. The scene is captured in professional studio lighting with a clean, modern tech aesthetic and a shallow depth of field." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC8bYoIsl-NzUOO2huiqE3hEbq0t-SNHwPj3N2ueIyY2fLpl17PZh6TAVGQZeMSEeI1e7ygxz8SmHuOz76jwh5hpWhe1T3q20PN098DdZn8k8MyHZQclkQc5Vhn2KN6M9ow374HF1QUCaDAGRQLEArYKUtfay5Zt2adxfyw37NWoBFTtJMpT6OQsSx4_B5jGufQigqgskz6wkI1Dv4nX1qxW3UTVHXNPGMDizi-c6ymM7Xjs3xI3bKQApzDTNUKXTKBdQhpryUYPGc')">
</div>
<!-- Scanning Overlay -->
<div class="absolute inset-0 flex items-center justify-center p-12">
<div class="w-full h-full border-2 border-white/40 rounded-3xl scanner-frame overflow-hidden">
<!-- Corner Brackets -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
<!-- Animated Scan Line -->
<div class="scanning-line absolute w-full z-10"></div>
</div>
</div>
<!-- Flash & Zoom Controls -->
<div class="absolute bottom-4 right-4 flex flex-col gap-2">
<button class="bg-black/40 backdrop-blur-md p-3 rounded-full text-white hover:bg-black/60 transition-all">
<span class="material-symbols-outlined">flashlight_on</span>
</button>
</div>
</section>
<!-- Scanned Items List -->
<section class="space-y-3">
<div class="flex items-center justify-between mb-2">
<h2 class="text-sm font-bold text-secondary uppercase tracking-wider">Recently Scanned</h2>
<span class="text-xs text-primary font-medium px-2 py-1 bg-primary-container/20 rounded-lg">Last scan: Just now</span>
</div>
<!-- Item 1 -->
<div class="flex items-center gap-4 p-3 bg-surface-container-lowest rounded-xl border border-surface-container-low hover:border-primary-container transition-colors">
<div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">check_circle</span>
</div>
<div class="flex-1 min-w-0">
<p class="text-sm font-semibold text-on-surface truncate">https://google.com</p>
<p class="text-xs text-on-surface-variant">Just now</p>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-xl">delete</span>
</button>
</div>
<!-- Item 2 -->
<div class="flex items-center gap-4 p-3 bg-surface-container-lowest rounded-xl border border-surface-container-low hover:border-primary-container transition-colors">
<div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">check_circle</span>
</div>
<div class="flex-1 min-w-0">
<p class="text-sm font-semibold text-on-surface truncate">WIFI:S:Guest_Net;P:pass123;;</p>
<p class="text-xs text-on-surface-variant">2 mins ago</p>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-xl">delete</span>
</button>
</div>
<!-- Item 3 -->
<div class="flex items-center gap-4 p-3 bg-surface-container-lowest rounded-xl border border-surface-container-low hover:border-primary-container transition-colors">
<div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">check_circle</span>
</div>
<div class="flex-1 min-w-0">
<p class="text-sm font-semibold text-on-surface truncate">https://amazon.com/deals/today</p>
<p class="text-xs text-on-surface-variant">5 mins ago</p>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-xl">delete</span>
</button>
</div>
</section>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full bg-surface-bright px-6 py-4 border-t border-surface-container shadow-[0_-4px_12px_rgba(0,0,0,0.03)] z-50">
<button class="w-full bg-primary text-on-primary py-4 rounded-2xl font-bold text-base shadow-lg shadow-primary/20 hover:bg-primary-dim transition-all active:scale-[0.98] duration-100 flex items-center justify-center gap-2">
            Finish &amp; Save All
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
<script>
        // Simple micro-interaction for list items
        document.querySelectorAll('section > div.flex.items-center').forEach(item => {
            item.addEventListener('click', () => {
                item.classList.add('bg-primary-container/10');
                setTimeout(() => {
                    item.classList.remove('bg-primary-container/10');
                }, 200);
            });
        });

        // Prevent bottom bar overlap on content
        const footerHeight = document.querySelector('footer').offsetHeight;
        document.querySelector('main').style.paddingBottom = (footerHeight + 24) + 'px';
    </script>
</body></html>
