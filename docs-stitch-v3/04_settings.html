<style>
        body { font-family: 'Inter', sans-serif; }

        }

        .switch-checkbox:checked + .switch-label .switch-dot { transform: translateX(20px); background-color: #ffffff; }

        input[type=range] {

<body class="bg-surface-container-low min-h-screen text-on-surface">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 flex justify-between items-center px-6 h-16 w-full bg-surface dark:bg-surface-dim transition-colors">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-100 hover:bg-surface-container-high p-2 rounded-full transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline text-xl font-bold text-on-surface">Settings</h1>
</div>
<div class="flex items-center gap-2">

</button>
</div>
</header>
<main class="pb-24 pt-4 px-4 max-w-2xl mx-auto space-y-6">
<!-- Section: General -->
<section>
<h2 class="px-4 mb-3 text-sm font-semibold uppercase tracking-wider text-outline">General</h2>
<div class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden">
<!-- Dark theme -->
<div class="flex items-center justify-between h-[56px] px-4 border-b border-surface-variant/30 active:bg-surface-container-high transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container">dark_mode</span>
</div>
<span class="text-sm font-medium">Dark theme</span>
</div>
<div class="relative inline-block w-11 h-6 align-middle select-none transition duration-200 ease-in">
<input class="switch-checkbox absolute block w-6 h-6 rounded-full bg-white border-2 border-outline appearance-none cursor-pointer focus:outline-none transition-all duration-200" id="dark_theme" name="dark_theme" type="checkbox"/>
<label class="switch-label block overflow-hidden h-6 rounded-full bg-outline-variant cursor-pointer transition-colors duration-200" for="dark_theme">
<span class="switch-dot block w-6 h-6 rounded-full bg-white transition-transform duration-200 shadow-sm border border-outline/20"></span>
</label>
</div>
</div>
<!-- Scan sound -->
<div class="flex items-center justify-between h-[56px] px-4 border-b border-surface-variant/30 active:bg-surface-container-high transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container">volume_up</span>
</div>
<span class="text-sm font-medium">Scan sound</span>
</div>
<div class="relative inline-block w-11 h-6 align-middle select-none">
<input checked="" class="switch-checkbox absolute block w-6 h-6 rounded-full bg-white border-2 border-outline appearance-none cursor-pointer focus:outline-none" id="scan_sound" name="scan_sound" type="checkbox"/>
<label class="switch-label block overflow-hidden h-6 rounded-full bg-outline-variant cursor-pointer" for="scan_sound">
<span class="switch-dot block w-6 h-6 rounded-full bg-white transition-transform duration-200 shadow-sm border border-outline/20"></span>
</label>
</div>
</div>

</div>

</div>

<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container">open_in_new</span>
</div>

</div>

<input class="switch-checkbox absolute block w-6 h-6 rounded-full bg-white border-2 border-outline appearance-none cursor-pointer focus:outline-none" id="auto_open" name="auto_open" type="checkbox"/>
<label class="switch-label block overflow-hidden h-6 rounded-full bg-outline-variant cursor-pointer" for="auto_open">
<span class="switch-dot block w-6 h-6 rounded-full bg-white transition-transform duration-200 shadow-sm border border-outline/20"></span>
</label>
</div>
</div>
